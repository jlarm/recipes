<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="15" fill="#E6F1E5"/>
  <!-- pan handle -->
  <line x1="41" y1="41" x2="55" y2="55" stroke="#2B2A28" stroke-width="7" stroke-linecap="round"/>
  <!-- pan body -->
  <circle cx="27" cy="27" r="19" fill="#2B2A28"/>
  <!-- fried egg white (overlapping circles form the wavy edge) -->
  <g fill="#FDFDFB">
    <circle cx="27" cy="27" r="13.5"/>
    <circle cx="17" cy="24" r="4.6"/>
    <circle cx="37" cy="30" r="4.6"/>
    <circle cx="28" cy="39" r="4.4"/>
    <circle cx="30" cy="16" r="4"/>
  </g>
  <!-- yolk -->
  <circle cx="25" cy="25" r="5.6" fill="#F5B620"/>
  <circle cx="23" cy="23" r="1.7" fill="#FCDD86"/>
</svg>
